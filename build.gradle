plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def useCuda = project.hasProperty('useCuda') && project.property('useCuda').toString().toLowerCase() == 'true'
def useDml = project.hasProperty('useDml') && project.property('useDml').toString().toLowerCase() == 'true'
def useCpu = project.hasProperty('useCpu') && project.property('useCpu').toString().toLowerCase() == 'true'
def withSourcesJar = project.hasProperty('withSourcesJar') && project.property('withSourcesJar').toString().toLowerCase() == 'true'

if ([useCuda, useDml, useCpu].count { it } > 1) {
    throw new GradleException("Only one of -PuseCuda, -PuseDml, or -PuseCpu may be specified at a time.")
}
if (!useDml && !useCpu && !useCuda) useDml = true

println "Build variant: ${useCuda ? 'CUDA' : useDml ? 'DirectML (Windows)' : 'CPU'}"
def modelRepositorySlug = 'xandergos/terrain-diffusion-30m-onnx'
def modelRepositoryRevision = 'ad2df557eca5645f588766101cf3bc3682455c3e'
def generatedManifestDirectory = layout.buildDirectory.dir('generated/model-assets').get().asFile
def generatedManifestFile = new File(generatedManifestDirectory, 'model-assets-manifest.json')

def buildVariant = useCuda ? 'cuda' : useDml ? 'windows' : 'cpu'
version = "${project.mod_version}-${buildVariant}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Minecraft 26.x is distributed already de-obfuscated and Fabric publishes no real
    // intermediary for it (the meta serves an identity 0.0.0 artifact). Tell Loom not to expect
    // a per-version intermediary so it does not try to resolve net.fabricmc:intermediary:26.2.
    noIntermediateMappings()

    splitEnvironmentSourceSets()

    mods {
        "terrain-diffusion-mc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            ideConfigGenerated true
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    flatDir { dirs 'libs'}
}

// --- Identity mappings for de-obfuscated Minecraft (26.x and newer) ---
// Minecraft 26.x is distributed already de-obfuscated with official Mojang names, and Mojang
// publishes no ProGuard mapping while Fabric publishes no Yarn/real intermediary for it. Loom's
// source remapper still requires a "mappings" artifact that exposes the official/intermediary/
// named namespaces, so we synthesise an identity mapping (every class mapped to itself) straight
// from the Minecraft client jar. This keeps the dev namespace identical to the shipped names.
def identityMappingsJar = layout.buildDirectory
        .file("generated/identity-mappings/minecraft-${project.minecraft_version}-identity-mappings.jar")
        .get().asFile

def generateIdentityMappings = {
    if (identityMappingsJar.exists()) return
    identityMappingsJar.parentFile.mkdirs()

    // Resolve the client jar URL from Mojang's version manifest (no hard-coded content hashes).
    def manifest = new JsonSlurper().parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
    def versionEntry = manifest.versions.find { it.id == project.minecraft_version }
    if (versionEntry == null) {
        throw new GradleException("Minecraft ${project.minecraft_version} not found in the Mojang version manifest")
    }
    def versionMeta = new JsonSlurper().parse(new URL(versionEntry.url as String))
    def clientUrl = versionMeta.downloads.client.url as String

    def clientJar = new File(identityMappingsJar.parentFile, "minecraft-${project.minecraft_version}-client.jar")
    if (!clientJar.exists()) {
        clientJar.withOutputStream { os -> new URL(clientUrl).withInputStream { is -> os << is } }
    }

    def classNames = [] as List<String>
    new java.util.zip.ZipFile(clientJar).withCloseable { zip ->
        zip.entries().each { e ->
            if (e.name.endsWith('.class') && !e.name.startsWith('META-INF/')) {
                classNames << e.name.substring(0, e.name.length() - '.class'.length())
            }
        }
    }

    def tiny = new StringBuilder('tiny\t2\t0\tofficial\tintermediary\tnamed\n')
    classNames.each { String c -> tiny.append('c\t').append(c).append('\t').append(c).append('\t').append(c).append('\n') }

    new java.util.zip.ZipOutputStream(identityMappingsJar.newOutputStream()).withCloseable { zos ->
        zos.putNextEntry(new java.util.zip.ZipEntry('mappings/mappings.tiny'))
        zos.write(tiny.toString().getBytes('UTF-8'))
        zos.closeEntry()
    }
    println "Generated identity mappings for Minecraft ${project.minecraft_version} (${classNames.size()} classes)"
}
generateIdentityMappings()

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.x ships de-obfuscated with official Mojang names and publishes no Yarn or
    // ProGuard mapping artifact, so the mod is written directly against Mojang ("named") names.
    // The identity (0.0.0) intermediary keeps the Minecraft jar in its official namespace, and
    // loom.noIntermediateMappings() (see the loom block) stops Loom from looking for a real
    // per-version intermediary. Mod dependencies stay modImplementation so Fabric API is still
    // expanded into loadable mods for the dev runtime (runClient/runServer/runDatagen).
    mappings files(identityMappingsJar)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (useCuda) {
        implementation "com.microsoft.onnxruntime:onnxruntime_gpu:1.20.0"
        include "com.microsoft.onnxruntime:onnxruntime_gpu:1.20.0"
    } else if (useCpu) {
        implementation "com.microsoft.onnxruntime:onnxruntime:1.20.0"
        include "com.microsoft.onnxruntime:onnxruntime:1.20.0"
    } else if (useDml) {
        implementation 'com.microsoft.onnxruntime:onnxruntime-dml:1.0'
        include 'com.microsoft.onnxruntime:onnxruntime-dml:1.0'
    }
}

processResources {
    dependsOn 'generateModelAssetManifest'
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "build_variant", buildVariant
    filteringCharset "UTF-8"
    from(generatedManifestFile) {
        into ''
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
    filesMatching("build-variant.properties") {
        expand "build_variant": buildVariant
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // Only use toolchain if current Java version is less than target
    // Commented out toolchain to avoid detection issues when Java 21 is already installed
    // if (JavaVersion.current() < javaVersion) {
    //     toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    // }
    // Loom attaches RemapSourcesJar to "build" when this is enabled. Off by default; use -PwithSourcesJar=true.
    if (withSourcesJar) {
        withSourcesJar()
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'log4j2.configurationFile', rootProject.file('log4j2-dev.xml').absolutePath
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

task pipelineTest(type: JavaExec, dependsOn: compileJava) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.xandergos.terraindiffusionmc.pipeline.PipelineTest'
    jvmArgs '-Xmx8g'
}

tasks.register('generateModelAssetManifest') {
    inputs.property('modelRepositorySlug', modelRepositorySlug)
    inputs.property('modelRepositoryRevision', modelRepositoryRevision)
    outputs.file(generatedManifestFile)

    doLast {
        generatedManifestDirectory.mkdirs()

        String apiUrl = "https://huggingface.co/api/models/${modelRepositorySlug}/revision/${modelRepositoryRevision}?blobs=true"
        Map modelInfo = new JsonSlurper().parseText(new URL(apiUrl).getText('UTF-8')) as Map
        List siblings = modelInfo.siblings as List

        List<String> requiredFiles = [
                'base_model.onnx',
                'coarse_model.onnx',
                'decoder_model.onnx',
                'pipeline_data.json',
                'world_pipeline_config.json'
        ]

        Map<String, Object> assetEntries = [:]
        for (String requiredFileName : requiredFiles) {
            Map siblingEntry = siblings.find { it.rfilename == requiredFileName } as Map
            if (siblingEntry == null) {
                throw new GradleException("Required model asset missing from HF commit ${modelRepositoryRevision}: ${requiredFileName}")
            }

            String resolveUrl = "https://huggingface.co/${modelRepositorySlug}/resolve/${modelRepositoryRevision}/${requiredFileName}?download=true"
            long expectedSizeBytes = ((Number) siblingEntry.size).longValue()
            String expectedSha256
            if (siblingEntry.lfs instanceof Map && siblingEntry.lfs.sha256 != null) {
                expectedSha256 = siblingEntry.lfs.sha256 as String
            } else {
                byte[] remoteFileBytes = new URL(resolveUrl).bytes
                expectedSha256 = sha256Hex(remoteFileBytes)
            }

            assetEntries[requiredFileName] = [
                    sha256: expectedSha256,
                    sizeBytes: expectedSizeBytes,
                    url: resolveUrl
            ]
        }

        Map<String, Object> manifestPayload = [
                repositorySlug: modelRepositorySlug,
                revision: modelRepositoryRevision,
                assets: assetEntries
        ]
        generatedManifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestPayload))
    }
}

def isWindows = System.getProperty('os.name').toLowerCase().startsWith('windows')
def gradlewExecutable = rootProject.file(isWindows ? 'gradlew.bat' : 'gradlew').absolutePath

['Cuda', 'Dml', 'Cpu'].each { variant ->
    tasks.register("build${variant}", Exec) {
        workingDir rootProject.projectDir
        commandLine gradlewExecutable, 'build', "-Puse${variant}=true"
    }
}

tasks.register('buildAll') {
    dependsOn 'buildCuda', 'buildDml', 'buildCpu'
}

String sha256Hex(byte[] fileBytes) {
    MessageDigest messageDigest = MessageDigest.getInstance('SHA-256')
    byte[] digestBytes = messageDigest.digest(fileBytes)
    StringBuilder hexBuilder = new StringBuilder(digestBytes.length * 2)
    for (byte digestByte : digestBytes) {
        hexBuilder.append(String.format('%02x', digestByte))
    }
    return hexBuilder.toString()
}
