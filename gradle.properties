# Heap for the Gradle daemon (Loom benefits from 2G+).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
# Select the build target with -PmcTarget=261|262|263 (default: 263).
mcTarget=263
# 26.1.x
mc261_minecraft=26.1.2
mc261_fabric=0.154.2+26.1.2
# 26.2
mc262_minecraft=26.2
mc262_fabric=0.154.2+26.2
# 26.3
mc263_minecraft=26.3
mc263_fabric=0.165.0+26.3
# Loader is shared across the whole 26.x line
loader_version=0.20.1
# Minecraft dependency declared in fabric.mod.json (26.3 changed the worldgen API, so the jars are not interchangeable)
minecraft_dependency=>=26.1 <26.3
mc263_minecraft_dependency=>=26.3
# Mod Properties
mod_version=2.2.0-port26.3
maven_group=com.github.xandergos
archives_base_name=terrain-diffusion-mc
