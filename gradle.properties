# Heap for the Gradle daemon (Loom remapJar / TinyRemapper benefits from 2G+).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Minecraft 26.x ships de-obfuscated, so the dev-namespace mapping is the identity intermediary
# (0.0.0) and has no entries. Loom's IDE-only "remap dependency sources" step cannot run against
# an empty mapping, so we run Loom in CI mode to skip it. Mod (binary) remapping is unaffected.
fabric.loom.ci=true
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.2
loader_version=0.19.3
# Mod Properties
mod_version=2.3.0
maven_group=com.github.xandergos
archives_base_name=terrain-diffusion-mc
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.153.0+26.2
